<!DOCTYPE html>
<html>

<head>

    <title>Huffman Encoding</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static',
        filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>
        Huffman Encoding Compression
    </h1>

    <form action="/compress" method="POST">

        <textarea
            name="text"
            placeholder="Enter text here..."
            required>{{ text if text else '' }}</textarea>

        <button type="submit">
            Compress
        </button>

    </form>

    {% if output %}

    <div class="output">

        <h2>Result</h2>

        <pre>{{ output }}</pre>

    </div>

    {% endif %}

</div>

</body>
</html>
